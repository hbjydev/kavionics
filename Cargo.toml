[workspace]
resolver = "3"
members = ["crates/cli", "crates/core", "crates/krpc", "crates/mission", "crates/telemetry"]

[workspace.package]
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/hbjydev/kavionics"

[workspace.dependencies]
kavionics-core = { path = "crates/core" }
kavionics-krpc = { path = "crates/krpc" }
kavionics-telemetry = { path = "crates/telemetry" }
kavionics-mission = { path = "crates/mission" }

async-trait = "0.1"
cel = "0.16"
stayputnik = { path = "../stayputnik" }
tokio = { version = "1.54", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
pklr = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
